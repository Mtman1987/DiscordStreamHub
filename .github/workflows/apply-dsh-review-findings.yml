name: Apply DSH review findings

on:
  push:
    branches:
      - fix/current-production-log-errors-20260812
    paths:
      - scripts/patch-dsh-review-findings.cjs
      - .github/workflows/apply-dsh-review-findings.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DSH_BUILD_DB: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/current-production-log-errors-20260812
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Apply review fixes
        run: node scripts/patch-dsh-review-findings.cjs
      - name: Validate focused regressions
        run: node --import tsx --test tests/current-production-log-regressions.test.ts
      - name: Validate full DSH contracts and build
        run: |
          npm run test:mtfixit
          npm run test:contracts
          npm run test:applications
          npm run typecheck
          npm run build
      - name: Commit validated review fixes
        run: |
          rm scripts/patch-dsh-review-findings.cjs .github/workflows/apply-dsh-review-findings.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/watch-mtfixit-twitch.ts src/lib/discord-sync-service.ts src/lib/runtime-config.ts src/lib/spmt-service-token.ts src/lib/twitch-chat-service.ts tests/current-production-log-regressions.test.ts scripts/patch-dsh-review-findings.cjs .github/workflows/apply-dsh-review-findings.yml
          git commit -m "Address DSH production log review findings"
          git push origin HEAD:fix/current-production-log-errors-20260812
