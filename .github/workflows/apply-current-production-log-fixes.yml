name: Apply current production log fixes

on:
  push:
    branches:
      - fix/current-production-log-errors-20260812
    paths:
      - scripts/patch-current-production-errors.cjs
      - .github/workflows/apply-current-production-log-fixes.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DSH_BUILD_DB: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/current-production-log-errors-20260812
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps --no-audit --no-fund
      - run: node scripts/patch-current-production-errors.cjs
      - name: Validate focused regressions
        run: node --import tsx --test tests/current-production-log-regressions.test.ts
      - name: Validate existing contracts
        run: |
          npm run test:mtfixit
          npm run test:contracts
          npm run test:applications
          npm run typecheck
          npm run build
      - name: Commit validated patch
        run: |
          rm scripts/patch-current-production-errors.cjs .github/workflows/apply-current-production-log-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/spmt-service-token.ts src/lib/mtfixit-service.ts src/app/api/discord/gateway-ingress/route.ts scripts/start.sh scripts/watch-mtfixit-twitch.ts src/lib/twitch-chat-service.ts src/lib/discord-sync-service.ts tests/current-production-log-regressions.test.ts scripts/patch-current-production-errors.cjs .github/workflows/apply-current-production-log-fixes.yml
          git commit -m "Fix current DSH production log errors"
          git push origin HEAD:fix/current-production-log-errors-20260812
