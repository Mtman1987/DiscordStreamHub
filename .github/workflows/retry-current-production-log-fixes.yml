name: Retry current production log fixes

on:
  push:
    branches:
      - fix/current-production-log-errors-20260812
    paths:
      - scripts/fix-current-production-patch-generator.cjs
      - .github/workflows/retry-current-production-log-fixes.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DSH_BUILD_DB: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/current-production-log-errors-20260812
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Fix generator and apply patch
        run: |
          node scripts/fix-current-production-patch-generator.cjs
          node scripts/patch-current-production-errors.cjs
      - name: Validate focused regressions
        run: node --import tsx --test tests/current-production-log-regressions.test.ts
      - name: Validate existing contracts
        run: |
          npm run test:mtfixit
          npm run test:contracts
          npm run test:applications
          npm run typecheck
          npm run build
      - name: Commit validated patch
        run: |
          rm scripts/fix-current-production-patch-generator.cjs scripts/patch-current-production-errors.cjs .github/workflows/apply-current-production-log-fixes.yml .github/workflows/retry-current-production-log-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix current DSH production log errors"
          git push origin HEAD:fix/current-production-log-errors-20260812
