name: One-time encrypted ecosystem data recovery

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ecosystem-recovery-once.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-data:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Export and encrypt persistent data
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_MAIN || secrets.FLY_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${FLY_API_TOKEN:-}" ]; then echo "No Fly API token configured"; exit 1; fi
          printf '%s\n' '-----BEGIN PUBLIC KEY-----' '' '-----END PUBLIC KEY-----' > /tmp/export-public.pem
          timeout 600s flyctl ssh console --app discord-stream-hub-new --machine d895de5b227d28 -C "sh -c 'tar --exclude=./clips --exclude=./music -cf - -C /data . | gzip -1 | base64'" > /tmp/data.b64
          base64 -d /tmp/data.b64 > /tmp/discord-stream-hub-new-data.tar.gz
          tar -tzf /tmp/discord-stream-hub-new-data.tar.gz > /tmp/discord-stream-hub-new-file-list.txt
          echo "Archive entries: $(wc -l < /tmp/discord-stream-hub-new-file-list.txt); bytes: $(wc -c < /tmp/discord-stream-hub-new-data.tar.gz)"
          openssl rand -hex 32 > /tmp/recovery-password
          openssl enc -aes-256-cbc -salt -pbkdf2 -in /tmp/discord-stream-hub-new-data.tar.gz -out /tmp/discord-stream-hub-new-data.tar.gz.enc -pass file:/tmp/recovery-password
          openssl pkeyutl -encrypt -pubin -inkey /tmp/export-public.pem -in /tmp/recovery-password -out /tmp/discord-stream-hub-new-data.key.enc
          rm -f /tmp/data.b64 /tmp/discord-stream-hub-new-data.tar.gz /tmp/recovery-password
      - name: Upload encrypted data archive
        uses: actions/upload-artifact@v4
        with:
          name: recovery-discord-stream-hub-new-encrypted
          path: |
            /tmp/discord-stream-hub-new-data.tar.gz.enc
            /tmp/discord-stream-hub-new-data.key.enc
            /tmp/discord-stream-hub-new-file-list.txt
          retention-days: 1
          if-no-files-found: error
